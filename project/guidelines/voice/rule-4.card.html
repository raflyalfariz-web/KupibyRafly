<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--surface-page);font-family:var(--font-text);color:var(--text-body)}
.pad{padding:16px 18px}
.lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);font-weight:600;margin:0 0 8px}
.cap{font-size:11.5px;line-height:16px;color:var(--text-muted);margin:6px 0 0;text-wrap:pretty}
/* WhatsApp mock — WA controls type and colour, so only structure is ours */
.phone{width:330px;border:7px solid #1B1B1B;border-radius:20px;overflow:hidden;background:#ECE5DD;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
.st{background:#075E54;color:#fff;font-size:11px;padding:4px 12px 2px;display:flex;justify-content:space-between}
.hd{background:#075E54;color:#fff;display:flex;gap:9px;align-items:center;padding:8px 11px}
.av{width:31px;height:31px;border-radius:50%;background:#F4E7D0;display:grid;place-items:center;color:#44250E;font-family:var(--font-display);font-weight:600;font-size:13px}
.nm{font-size:15px;font-weight:600}
.sb{font-size:11px;opacity:.85}
.thread{padding:9px 8px;display:flex;flex-direction:column;gap:6px}
.b{max-width:84%;border-radius:9px;padding:6px 9px 4px;font-size:14.5px;line-height:19.5px;color:#111B21;box-shadow:0 1px .5px rgba(11,20,26,.13);white-space:pre-line}
.me{align-self:flex-end;background:#DCF8C6;border-top-right-radius:2px}
.you{align-self:flex-start;background:#fff;border-top-left-radius:2px}
.t{display:block;text-align:right;font-size:10.5px;color:#667781;margin-top:2px}
.cmp{background:#F0F0F0;padding:7px 8px;display:flex;gap:7px;align-items:center}
.inp{flex:1;background:#fff;border-radius:16px;padding:8px 11px;font-size:13px;color:#8696A0}
.snd{width:34px;height:34px;border-radius:50%;background:#075E54;color:#fff;display:grid;place-items:center;font-size:14px}
</style></head><body><div class="pad" style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
<div style="background:#F8E0D2;border-radius:var(--radius-md);padding:12px 14px">
<p class="lbl" style="color:#9C4416;margin-bottom:5px">Sebelum</p>
<p style="margin:0;font-size:13.5px;line-height:20px;color:#7A3A12;white-space:pre-line">Baik kak, untuk pesanannya sudah kami terima ya, mohon ditunggu, nanti akan kami informasikan kembali terkait pengiriman dan totalnya sekaligus.</p></div>
<div style="background:#DCEEE2;border-radius:var(--radius-md);padding:12px 14px">
<p class="lbl" style="color:#256B45;margin-bottom:5px">Sesudah</p>
<p style="margin:0;font-size:13.5px;line-height:20px;color:#1C4F35;white-space:pre-line">Kecatat ya.

(pesan berikutnya)
