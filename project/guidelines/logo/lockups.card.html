<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--surface-page);font-family:var(--font-text);color:var(--text-body)}
.pad{padding:18px 20px}
.lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);font-weight:600;margin:0 0 8px}
.cap{font-size:11.5px;line-height:16px;color:var(--text-muted);margin:6px 0 0;text-wrap:pretty}
</style></head><body><div class="pad" style="display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap">
<div><p class="lbl">Stacked &middot; master</p><img src="../../assets/logo-stacked.png" style="height:150px"><p class="cap">Bottle label, QR page hero, stamps.</p></div>
<div><p class="lbl">Horizontal</p><img src="../../assets/logo-horizontal.png" style="height:66px"><p class="cap">App and page headers, invoice top, receipts.</p></div>
<div><p class="lbl">Mark</p><img src="../../assets/logo-mark.png" style="height:44px"><p class="cap">Cap, chat avatar, favicon, small stickers.</p></div>
<div style="background:var(--brown-700);padding:16px 20px;border-radius:var(--radius-md)"><p class="lbl" style="color:var(--cream-200)">On brown</p><img src="../../assets/logo-horizontal-cream.png" style="height:58px"><p class="cap" style="color:var(--cream-200);opacity:.8">Cream artwork only. Never the brown file on brown.</p></div>
</div></body></html>
