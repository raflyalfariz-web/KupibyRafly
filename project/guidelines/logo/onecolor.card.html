<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--surface-page);font-family:var(--font-text);color:var(--text-body)}
.pad{padding:18px 20px}
.lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);font-weight:600;margin:0 0 8px}
.cap{font-size:11.5px;line-height:16px;color:var(--text-muted);margin:6px 0 0;text-wrap:pretty}
</style></head><body><div class="pad" style="display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap">
<div style="background:var(--cream-100);padding:16px;border:1px solid var(--border-default);border-radius:var(--radius-sm)"><p class="lbl">Brown on cream</p><img src="../../assets/logo-stacked.png" style="height:96px"></div>
<div style="background:var(--brown-700);padding:16px;border-radius:var(--radius-sm)"><p class="lbl" style="color:var(--cream-200)">Cream on brown</p><img src="../../assets/logo-stacked-cream.png" style="height:96px"></div>
<div style="background:#fff;padding:16px;border:1px solid var(--border-default);border-radius:var(--radius-sm)"><p class="lbl">Black on white &middot; stamp</p><img src="../../assets/logo-stacked.png" style="height:96px;filter:brightness(0) saturate(0)"></div>
<p class="cap" style="max-width:190px">One ink means one ink: the same file, filled solid. Do not add a keyline, drop shadow, or a lighter roof. For a rubber stamp or a thermal receipt, use the black version at 25mm or larger.</p>
</div></body></html>
