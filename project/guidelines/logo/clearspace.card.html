<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--surface-page);font-family:var(--font-text);color:var(--text-body)}
.pad{padding:18px 20px}
.lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);font-weight:600;margin:0 0 8px}
.cap{font-size:11.5px;line-height:16px;color:var(--text-muted);margin:6px 0 0;text-wrap:pretty}
</style></head><body><div class="pad" style="display:flex;gap:34px;align-items:flex-start">
<div>
<p class="lbl">Mark &middot; 0.5R all sides</p>
<div style="position:relative;display:inline-block;padding:33px;outline:2px dashed var(--neutral-300);background:var(--cream-100)">
<img src="../../assets/logo-mark.png" style="height:66px;display:block">
<span style="position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--amber-600);font-weight:600">0.5R</span>
<span style="position:absolute;top:6px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--amber-600);font-weight:600">0.5R</span>
</div>
<p class="cap" style="max-width:230px">R = height of the roof. On a 66px mark that is 33px of nothing on every side.</p>
</div>
<div>
<p class="lbl">Lockups &middot; 0.35R all sides</p>
<div style="display:inline-block;padding:23px;outline:2px dashed var(--neutral-300);background:var(--cream-100)">
<img src="../../assets/logo-horizontal.png" style="height:66px;display:block">
</div>
<p class="cap" style="max-width:270px">Text, prices, buttons, bottle edge, QR code &mdash; all stay outside. If in doubt, use the width of the letter K.</p>
</div>
</div></body></html>
